spring.application.name=crud-categorias

# Perfil por defecto: H2 en memoria (para correr desde IntelliJ sin Docker).
# Usa un nombre de base distinto al de productos para no mezclarlas en desarrollo local.
spring.datasource.url=jdbc:h2:mem:categoriasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Este proyecto corre en el puerto 8081 porque el 8080 ya lo usa crud-productos
server.port=8081
