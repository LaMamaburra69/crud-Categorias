# Perfil "mysql": se activa con SPRING_PROFILES_ACTIVE=mysql (lo define docker-compose.yml)
# Apunta a LA MISMA base de datos que usa crud-productos (productosdb).
# Hibernate crea la tabla "categoria" ahi mismo, junto a la tabla "producto".

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productosdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:productos}
spring.datasource.password=${DB_PASSWORD:productos123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.port=8080
